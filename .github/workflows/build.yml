name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove Test menu items
        run: |
          find . -name "*.xml" -path "*/menu/*" | while read f; do
            if grep -q "menu_test" "$f"; then
              sed -i '/menu_test/d' "$f"
              echo "Removed menu_test from $f"
            fi
          done
          find . \( -name "*.java" -o -name "*.kt" \) -path "*/src/*" | while read f; do
            if grep -q "menu_test\|R\.id\.menu_test" "$f" 2>/dev/null; then
              sed -i 's/^.*menu_test.*$/\/\/ &/' "$f"
              echo "Commented menu_test in $f"
            fi
          done

      - name: Keep only Chinese resources
        run: |
          find . -path "*/res/values-*" -type d | while read dir; do
            case "$(basename "$dir")" in
              values-zh|values-zh-rCN|values-zh-rHK|values-zh-rTW|values-night*|values-v*)
                echo "KEEP: $dir" ;;
              *)
                echo "REMOVE: $dir"
                rm -rf "$dir" ;;
            esac
          done

      - name: Remove test directories
        run: |
          find . -type d \( -name "test" -o -name "androidTest" \) -path "*/src/*" | while read d; do
            echo "REMOVE: $d"
            rm -rf "$d"
          done

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          rm -rf /usr/local/lib/android/sdk 2>/dev/null || true
          unset ANDROID_SDK_ROOT 2>/dev/null || true
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Build APK
        run: ./gradlew :assembly:assembleCompleteFdroidDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: insular-enhanced-cn
          path: assembly/build/outputs/apk/completeFdroid/debug/*.apk
