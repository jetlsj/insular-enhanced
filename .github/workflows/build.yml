name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ========== 1. 删除 Test 菜单项 ==========
      - name: Remove Test menu items
        run: |
          echo "=== Removing menu_test from XML ==="
          find . -name "*.xml" -path "*/menu/*" | while read f; do
            if grep -q "menu_test" "$f"; then
              echo "Found menu_test in: $f"
              sed -i '/menu_test/d' "$f"
              echo "Removed from $f"
            fi
          done
          
          echo "=== Removing menu_test code references ==="
          find . \( -name "*.java" -o -name "*.kt" \) -path "*/src/*" | while read f; do
            if grep -q "menu_test\|R\.id\.menu_test" "$f" 2>/dev/null; then
              echo "Found in: $f"
              sed -i 's/^.*menu_test.*$/\/\/ &/' "$f"
              echo "Commented out in $f"
            fi
          done

      # ========== 2. 只保留中文语言资源 ==========
      - name: Keep only Chinese resources
        run: |
          find . -path "*/res/values-*" -type d | while read dir; do
            case "$(basename "$dir")" in
              values-zh|values-zh-rCN|values-zh-rHK|values-zh-rTW|values-night*|values-v*)
                echo "KEEP: $dir"
                ;;
              *)
                echo "REMOVE: $dir"
                rm -rf "$dir"
                ;;
            esac
          done

      # ========== 3. 删除测试代码目录 ==========
      - name: Remove test directories
        run: |
          find . -type d \( -name "test" -o -name "androidTest" \) -path "*/src/*" | while read d; do
            echo "REMOVE: $d"
            rm -rf "$d"
          done

      # ========== 4. 设置 JDK 17 ==========
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ========== 5. 手动安装 Android SDK（清除冲突路径）==========
      - name: Setup Android SDK
        run: |
          rm -rf /usr/local/lib/android/sdk
          unset ANDROID_SDK_ROOT
          
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # ========== 6. 编译 ==========
      - name: Build APK
        run: ./gradlew :assembly:assembleCompleteFdroidDebug --console=plain

      # ========== 7. 上传产物 ==========
      - uses: actions/upload-artifact@v4
        with:
          name: insular-enhanced-cn
          path: assembly/build/outputs/apk/completeFdroid/debug/*.apk
