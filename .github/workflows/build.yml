name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove Test menu item
        run: |
          # 查找并删除菜单 XML 中的 Test 项
          find . -path "*/res/menu/*.xml" -exec grep -l "Test" {} \; | while read f; do
            sed -i '/Test/d' "$f"
            echo "Removed Test from $f"
          done
          # 查找并删除代码中引用 Test 菜单 ID 的分支
          find . -path "*/src/main/java/*.java" -o -path "*/src/main/java/*.kt" | while read f; do
            if grep -q "action_test\|R.id.*test\|test.*->" "$f" 2>/dev/null; then
              sed -i '/action_test/d;/R\.id\..*test/d;/test.*->/d' "$f"
              echo "Removed Test references from $f"
            fi
          done

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: ./gradlew :assembly:assembleCompleteFdroidDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: insular-enhanced-debug
          path: assembly/build/outputs/apk/completeFdroid/debug/*.apk
