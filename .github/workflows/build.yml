name: Debug Find Test

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find all menu XML files
        run: |
          echo "=== All menu XML files ==="
          find . -name "*.xml" -path "*/menu*" | head -20
          
          echo ""
          echo "=== Files containing 'Test' (case insensitive) ==="
          grep -rni "test" --include="*.xml" res/ 2>/dev/null | head -30 || true
          grep -rni "test" --include="*.xml" assembly/src/ 2>/dev/null | head -30 || true
          
          echo ""
          echo "=== Full content of menu files ==="
          find . -name "*.xml" -path "*/menu*" -exec echo ">>> {}" \; -exec cat {} \;

      - name: Find Test in Java/Kotlin
        run: |
          echo "=== Java/Kotlin files with 'test' ==="
          grep -rni "test" --include="*.java" --include="*.kt" assembly/src/main/java/ 2>/dev/null | grep -i "menu\|R.id\|optionsItemSelected" | head -20 || true
